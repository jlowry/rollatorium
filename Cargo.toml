[workspace]
members = ["packages/*"]
exclude = ["packages/rollatorium/fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.1-snapshot"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mettlekettle/rollatorium"

[workspace.dependencies]
rollatorium-core = { path = "packages/rollatorium-core", version = "0.0.1-snapshot" }
rollatorium-macros = { path = "packages/rollatorium-macros", version = "0.0.1-snapshot" }
rand = "0.9.2"
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "printing"] }
quote = "1"
proc-macro2 = "1"
proptest = "1.8.0"
serde_json = "1"
trybuild = "1.0"
