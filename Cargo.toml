[package]
name = "rollatorium"
version = "0.0.1-snapshot"
edition = "2024"
rust-version = "1.85"
description = "Parse and evaluate tabletop-RPG dice expressions (4d6kh3, 3d6rr<3, annotated rolls) into a detailed result tree"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mettlekettle/rollatorium"
documentation = "https://docs.rs/rollatorium"
readme = "README.md"
keywords = ["dice", "rpg", "tabletop", "roll", "parser"]
categories = ["games", "parser-implementations"]

[features]
default = []
fail-on-warnings = []
serde = ["dep:serde"]

[dependencies]
rand = "0.9.2"
thiserror = { version = "2", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
proptest = "1.8.0"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
