[package]
name = "rollatorium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Parse and evaluate tabletop-RPG dice expressions (4d6kh3, 3d6rr<3, annotated rolls) into a detailed result tree"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rollatorium"
readme = "README.md"
keywords = ["dice", "rpg", "tabletop", "roll", "parser"]
categories = ["games", "parser-implementations"]

[features]
default = ["macros"]
macros = ["dep:rollatorium-macros"]
# Forward to the crates that hold the actual code; the facade itself is glue.
fail-on-warnings = ["rollatorium-core/fail-on-warnings", "rollatorium-macros?/fail-on-warnings"]
serde = ["rollatorium-core/serde"]

# This crate is a thin re-export facade; rand/thiserror/serde are used only by
# `rollatorium-core` (re-exported transitively), so they are not direct deps
# here. `rand` stays as a dev-dependency because the integration tests use it.
[dependencies]
rollatorium-core = { workspace = true }
rollatorium-macros = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
trybuild = { workspace = true }

[package.metadata.docs.rs]
all-features = true
